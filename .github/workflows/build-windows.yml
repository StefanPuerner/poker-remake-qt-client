# Workflow de GitHub Actions: compila PokerClientQt en Windows y lo empaqueta
# en un instalador .exe (windeployqt + Inno Setup).
#
# "Workflow" = una receta de pasos que corre GitHub en una máquina virtual
# suya, no en la tuya. Este fichero es esa receta.

name: Build Windows

# Cuándo se dispara este workflow:
on:
  workflow_dispatch:
    # Permite lanzarlo a mano desde la pestaña "Actions" de GitHub,
    # sin necesidad de etiqueta — útil para probar cambios al workflow.
  push:
    tags: [ 'v*' ]
    # Ya no en cada push a master (eso era solo para depurarlo) — ahora
    # solo cuando subas una etiqueta de versión, ej: git push origin v0.1.1

# Necesario para que la acción de más abajo pueda crear/editar el Release
# de GitHub — por defecto, el token automático del workflow es de solo
# lectura.
permissions:
  contents: write

jobs:
  build:
    # "windows-latest" = una máquina virtual Windows que GitHub aprovisiona
    # bajo demanda, con Visual Studio ya instalado. Se destruye al terminar.
    runs-on: windows-latest

    steps:
      # Paso 1: traer el código del repo a esa máquina virtual (equivalente
      # a un "git clone" tuyo, pero lo hace GitHub automáticamente).
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # Paso 2: instalar Qt6. Instalar Qt a mano requiere un instalador
      # gráfico interactivo — imposible de automatizar sin esto. Esta
      # acción (mantenida por la comunidad, muy usada) descarga los
      # componentes de Qt directamente, sin instalador gráfico.
      - name: Instalar Qt6
        uses: jurplel/install-qt-action@v4
        with:
          # 6.8.* → 6.10.* (2026-09-02): QTBUG-135079 -- windeployqt en
          # 6.8.1-6.8.3 no copiaba plugins\tls\ (el backend Schannel que
          # main.cpp fuerza vía QSslSocket::setActiveBackend) al paquete
          # final -- causa real de que Windows no conectara pese al fix
          # de Schannel en el código. Arreglado oficialmente en
          # 6.8.4/6.9.1/6.10.0. Se copia también a mano más abajo (paso
          # "Asegurar el plugin TLS"), como defensa extra.
          version: '6.10.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # Multimedia es un módulo ADICIONAL (no viene con "desktop" a
          # secas) -- PokerClientQt lo necesita para el sonido de "tu
          # turno" (ver CMakeLists.txt). Sin esto, find_package(Qt6
          # REQUIRED COMPONENTS Multimedia) aborta el configure entero.
          # qtshadertools: compila assets/shaders/dither.frag a .qsb (el dithering
          # de degradados que usa el QML). Sin él, CMake se para con un FATAL_ERROR
          # que dice qué falta (ver cmake/ClientesQt.cmake).
          modules: 'qtmultimedia qtshadertools'

      # Paso 3: configurar el proyecto con CMake — igual que
      # "cmake -B build" en Linux, pero MSVC es un generador de "varios
      # modos" (a diferencia de Makefiles), así que el tipo de build se
      # elige al compilar (paso 4), no aquí.
      - name: Configurar CMake
        run: cmake -B build

      # Paso 4: compilar de verdad. --target PokerClientQt: el CMakeLists
      # también define PokerClientMobile (binario de escritorio normal
      # cuando no se cross-compila para Android) -- SÍ se compila y empaqueta
      # aparte, al final del job, pero como artefacto de nicho, no aquí.
      - name: Compilar
        run: cmake --build build --target PokerClientQt --config RelWithDebInfo

      # Paso 5: windeployqt — la herramienta oficial de Qt para "empaquetado
      # in situ": analiza el .exe, ve qué DLLs de Qt usa de verdad, y las
      # copia AL LADO del propio .exe (en la misma carpeta), junto con las
      # subcarpetas de plugins (platforms/, qml/...) que Qt necesita en
      # tiempo de ejecución. La acción de instalar Qt del paso 2 ya deja
      # windeployqt.exe en el PATH, así que se puede llamar directo.
      - name: Empaquetar dependencias de Qt (windeployqt)
        run: windeployqt --qmldir src\client-qt\qml build\RelWithDebInfo\PokerClientQt.exe

      # QTBUG-135079 (ver el comentario junto a "Instalar Qt6") -- copia a
      # mano el backend TLS por si windeployqt no lo trajo solo. Busca
      # windeployqt.exe en el PATH para deducir la raíz de la instalación
      # de Qt sin depender de una variable de entorno concreta de la
      # acción que lo instaló.
      - name: Asegurar el plugin TLS (Schannel) en el paquete final
        shell: pwsh
        run: |
          $windeployqt = (Get-Command windeployqt.exe).Source
          $qtRoot = Split-Path (Split-Path $windeployqt -Parent) -Parent
          $tlsSrc = Join-Path $qtRoot "plugins\tls"
          if (-not (Test-Path $tlsSrc)) {
            throw "No se encontró plugins\tls en la instalación de Qt ($tlsSrc) -- no se puede garantizar TLS."
          }
          $tlsDst = "build\RelWithDebInfo\tls"
          New-Item -ItemType Directory -Force -Path $tlsDst | Out-Null
          Copy-Item "$tlsSrc\*.dll" $tlsDst -Force
          Write-Host "Backend(s) TLS copiados a $tlsDst :"
          Get-ChildItem $tlsDst

      # Paso 6: comprimir la carpeta ya empaquetada en un .zip portable, en
      # vez de envolverla en un instalador de Inno Setup.
      #
      # Motivo (no es una preferencia de estilo, es un problema real):
      # Windows Defender detectó y borró el instalador de la versión
      # anterior como si fuera malware — falso positivo, pero muy conocido:
      # el "stub" (envoltorio) que genera Inno Setup es uno de los más
      # señalados por los motores heurísticos, precisamente porque mucho
      # malware real también lo usa para empaquetarse. Un .exe suelto
      # (sin ese envoltorio) no tiene esa forma reconocible, así que baja
      # mucho el riesgo de un falso positivo — aunque no lo garantiza del
      # todo, los heurísticos de Defender no son 100% predecibles.
      # El script de Inno Setup (installer.iss) se queda en el repo sin
      # usar por ahora — cuando tengamos firma de código de verdad,
      # retomamos el instalador con asistente/desinstalador.
      - name: Comprimir en .zip portable
        run: Compress-Archive -Path build\RelWithDebInfo\* -DestinationPath PokerRemake-Windows-x86_64.zip

      # Paso 7: dejarlo como resultado descargable de esta ejecución del
      # workflow (pestaña "Actions" → esta ejecución → "Artifacts").
      #
      # archive: false -- sin él, upload-artifact comprime SIEMPRE en un
      # .zip lo que se le suba, aunque ya sea un .zip -- "zip dentro de
      # zip" (bug real reportado 2026-09-16: alguien probando desde la
      # pestaña Actions, no una Release de verdad, encontró un .zip
      # dentro del .zip descargado, entró a ese interior sin extraerlo, y
      # el .exe fallaba con "no se encontró tal.dll" porque Windows lo
      # ejecutaba aislado desde dentro del zip, sin sus DLL al lado --
      # nada roto en el paquete en sí). Mismo arreglo que ya tenía
      # build-android.yml para su .apk -- ver su comentario gemelo. Solo
      # afecta a la descarga desde "Artifacts" de una ejecución concreta,
      # nunca a los assets de una Release de verdad (esos se adjuntan
      # directos en el paso de abajo, sin pasar por upload-artifact).
      - name: Subir el .zip como artefacto
        uses: actions/upload-artifact@v7
        with:
          path: PokerRemake-Windows-x86_64.zip
          archive: false
          if-no-files-found: error

      # Paso 8: adjuntar el .zip al Release de GitHub correspondiente a la
      # etiqueta que disparó este workflow. Si el Release no existe
      # todavía, esta acción lo crea sola; si ya existe (por ejemplo,
      # porque el workflow de Linux llegó primero y ya lo creó), simplemente
      # añade este fichero como asset adicional — no hay conflicto entre
      # los dos workflows corriendo en paralelo sobre la misma etiqueta.
      # "if" evita este paso cuando se lanza a mano (workflow_dispatch),
      # ya que ahí no hay una etiqueta real de la que colgar un Release.
      - name: Adjuntar al Release de GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PokerRemake-Windows-x86_64.zip
          # Descripción del release: NOVEDADES.md, en la raíz del repo. Se
          # actualiza a mano antes de cada etiqueta. Los tres workflows la
          # ponen igual, así que da igual cuál cree el release primero.
          body_path: NOVEDADES.md

      # ── PokerClientMobile como binario de Windows (pasos aparte, tras el Release de escritorio) ──
      #  No es un cliente de escritorio de verdad -- es el mismo binario táctil
      #  landscape del móvil (el CMakeLists ya lo compila así cuando no se
      #  cross-compila para Android, ver el comentario en main-mobile.cpp), pensado
      #  para correr en un PC que hace de host de streaming (Moonlight/Sunshine)
      #  hacia un teléfono -- así se puede jugar desde un iPhone, donde no hay APK.
      #  Mismo Qt ya instalado en el paso 2, sin steps nuevos de setup.
      #  A propósito NO se menciona en NOVEDADES.md ni se destaca junto al .zip de
      #  escritorio -- es un añadido de nicho para quien lo necesite (se ve entre
      #  los assets del Release, con nombre propio), no la forma normal de jugar en PC.
      - name: Compilar PokerClientMobile
        run: cmake --build build --target PokerClientMobile --config RelWithDebInfo

      # PokerClientQt y PokerClientMobile caen en LA MISMA carpeta de salida
      # (build\RelWithDebInfo\, CMAKE_RUNTIME_OUTPUT_DIRECTORY es uno solo para
      # todo el proyecto -- ver cmake/Comun.cmake). Copiar el .exe del móvil a una
      # carpeta propia ANTES de windeployqt evita que su .zip acabe llevándose
      # también PokerClientQt.exe y el módulo QML de escritorio (windeployqt
      # despliega junto al .exe que se le pasa, así que con esto despliega solo
      # lo que el móvil necesita, en su propia carpeta).
      - name: Aislar el ejecutable del móvil en su propia carpeta
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\PaqueteMovil | Out-Null
          Copy-Item build\RelWithDebInfo\PokerClientMobile.exe build\PaqueteMovil\ -Force

      # --qmldir apunta a qml-mobile (el árbol QML del móvil, NO qml/): PokerClientMobile
      # carga NO_CACHEGEN (interpretado, no bytecode -- ver cmake/ClientesQt.cmake), así
      # que windeployqt necesita mirar ESE árbol para resolver sus imports de verdad.
      - name: Empaquetar dependencias de Qt (móvil, windeployqt)
        run: windeployqt --qmldir src\client-qt\qml-mobile build\PaqueteMovil\PokerClientMobile.exe

      # Mismo motivo que el paso gemelo de PokerClientQt más arriba (QTBUG-135079).
      - name: Asegurar el plugin TLS (Schannel) en el paquete final (móvil)
        shell: pwsh
        run: |
          $windeployqt = (Get-Command windeployqt.exe).Source
          $qtRoot = Split-Path (Split-Path $windeployqt -Parent) -Parent
          $tlsSrc = Join-Path $qtRoot "plugins\tls"
          if (-not (Test-Path $tlsSrc)) {
            throw "No se encontró plugins\tls en la instalación de Qt ($tlsSrc) -- no se puede garantizar TLS."
          }
          $tlsDst = "build\PaqueteMovil\tls"
          New-Item -ItemType Directory -Force -Path $tlsDst | Out-Null
          Copy-Item "$tlsSrc\*.dll" $tlsDst -Force
          Write-Host "Backend(s) TLS copiados a $tlsDst :"
          Get-ChildItem $tlsDst

      - name: Comprimir en .zip portable (móvil)
        run: Compress-Archive -Path build\PaqueteMovil\* -DestinationPath PokerRemake-Windows-Movil-x86_64.zip

      - name: Subir el .zip como artefacto (móvil)
        uses: actions/upload-artifact@v7
        with:
          path: PokerRemake-Windows-Movil-x86_64.zip
          archive: false
          if-no-files-found: error

      - name: Adjuntar al Release de GitHub (móvil)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PokerRemake-Windows-Movil-x86_64.zip
          body_path: NOVEDADES.md
