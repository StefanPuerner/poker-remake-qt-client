# Igual que build-windows.yml, pero para Linux: compila y empaqueta un
# AppImage con linuxdeploy + linuxdeploy-plugin-qt (las mismas herramientas
# que usamos a mano ayer). Al compilar en un Ubuntu limpio de GitHub, en
# vez de en tu Arch/Hyprland local, evitamos de raíz el problema de
# ventana-que-no-aparecía que investigamos ayer — era un asunto de esa
# sesión concreta del compositor, no del AppImage en sí.

name: Build Linux (AppImage)

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    # A diferencia de "windows-latest", este es Ubuntu — más parecido al
    # tipo de sistema que probablemente usen tus amigos en Linux (o no,
    # el AppImage no depende de qué distro sea, esa es la idea).
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # Misma acción que en Windows, mismo Qt — solo cambia "host" a linux.
      - name: Instalar Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'

      - name: Configurar CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compilar
        run: cmake --build build -j$(nproc)

      # linuxdeploy no viene instalado en el runner (a diferencia de Inno
      # Setup en Windows) — se descarga como los AppImage que son, se
      # marcan ejecutables, y ya.
      - name: Descargar linuxdeploy y su plugin de Qt
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      # Construir el AppDir a mano, igual que hicimos ayer en la terminal:
      # el binario en usr/bin/, el .desktop y el icono en las rutas que
      # espera el estándar freedesktop.org.
      - name: Montar el AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/PokerClientQt AppDir/usr/bin/
          cp pokerremake.desktop AppDir/usr/share/applications/
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/pokerremake.png

      # linuxdeploy no empaqueta el plugin de plataforma "wayland" de Qt
      # (el runner no tiene una sesión Wayland de la que copiarlo -- no es
      # cuestión de pedírselo con una variable, los ficheros del plugin ni
      # siquiera están accesibles para copiar en un runner headless), así
      # que en cualquier sesión Wayland real (Hyprland, GNOME, KDE...) que
      # exporte QT_QPA_PLATFORM=wayland, la app fallaba en seco al no
      # encontrar ese plugin dentro del AppImage (confirmado extrayendo un
      # AppImage real: cero ficheros libqwayland-*.so empaquetados). Y
      # forzando xcb a mano sin más, Qt elegía por defecto la integración
      # GLX (frágil bajo XWayland, "Failed to create dummy context"
      # reproducido en real) en vez de EGL, que sí funciona. Este hook lo
      # ejecuta el AppRun que genera linuxdeploy ANTES de lanzar el
      # binario -- "${VAR:-...}" para no pisar nada si quien lo ejecuta ya
      # trae sus propias variables. Mismo fix ya validado en el repo
      # privado (build-appimage-dev.yml).
      - name: Forzar XWayland+EGL en el AppImage (evita el plugin wayland ausente y el fallo de GLX)
        run: |
          mkdir -p AppDir/apprun-hooks
          cat > AppDir/apprun-hooks/linuxdeploy-plugin-qt-egl.sh << 'EOF'
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-xcb}"
          export QT_XCB_GL_INTEGRATION="${QT_XCB_GL_INTEGRATION:-xcb_egl}"
          EOF

      # QML_SOURCES_PATHS le dice al plugin de Qt dónde mirar los .qml
      # fuente para averiguar qué módulos de Qt Quick hacen falta bundlear
      # (Controls, etc.) — lo mismo que hicimos ayer a mano.
      - name: Generar el AppImage
        env:
          QML_SOURCES_PATHS: src/client-qt/qml
        run: |
          export PATH="$PWD:$PATH"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/PokerClientQt \
            --desktop-file AppDir/usr/share/applications/pokerremake.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/pokerremake.png \
            --plugin qt \
            --output appimage

      - name: Subir el AppImage como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PokerRemake-Linux-AppImage
          path: PokerRemake-x86_64.AppImage

      # Misma acción y mismo razonamiento que en build-windows.yml —
      # crea el Release si hace falta, o añade este fichero si el otro
      # workflow ya lo creó primero.
      - name: Adjuntar al Release de GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PokerRemake-x86_64.AppImage
